name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  generated:
    name: generated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Regenerate the tracked generated files and fail when the
      # committed copies drift (same shape as the cargo fmt --check
      # gate).
      - run: cargo xtask gen-lua-types --check
      # Re-render crates/kage-provider/src/catalog/generated.rs from
      # the committed upstream snapshot, so hand edits to the catalog
      # and unregenerated generator changes fail here. The snapshot is
      # rewritten by refresh-models whenever generated.rs is, keeping
      # the gate offline and deterministic.
      - run: >-
          cargo xtask refresh-models --check
          --source file://xtask/fixtures/models.json
      # Re-render man/kage.1 from the clap CLI definition and diff it
      # against the committed page, so flag changes force a refresh
      # before release.yml ships a stale page in every archive. The
      # page embeds the crate version, so a version bump must
      # regenerate it in the same change.
      - name: gen-manpage drift
        run: |
          cargo build -p kage-cli
          ./target/debug/kage gen-manpage --out man/kage.1 --check
      # Enforce the ASCII-only source rule. Scans crates/, gui/src,
      # xtask/src, plugins/ and man/; Unicode glyphs must be written as
      # `\u{..}` escapes, not raw bytes.
      - run: cargo xtask check-ascii

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets -- -D warnings

  msrv:
    name: msrv (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace
            toolchain: "1.89.0"
            workdir: .
            check: cargo +1.89.0 check --workspace --all-targets --locked
          # gui/ is its own Cargo workspace. Its pinned gpui-kit stack
          # needs 1.95 (`slice_as_array`, `std::hint::cold_path`), so
          # the floor is the pin; the leg still catches anything in the
          # lockfile that quietly starts needing newer.
          - name: gui
            toolchain: "1.95.0"
            workdir: gui
            check: cargo +1.95.0 check --all-targets --locked
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.workdir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workspace and gui pin their toolchains via
      # rust-toolchain.toml; the MSRV gates check the declared floors
      # against the committed Cargo.locks, so install the floors and
      # never touch the pins.
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-${{ matrix.toolchain }}
          workspaces: ${{ matrix.workdir }}
      - run: ${{ matrix.check }}

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # --no-fail-fast so one failing OS surfaces every failure in that
      # leg instead of hiding them behind the first.
      - run: cargo nextest run --all-targets --no-tests=pass --no-fail-fast

  gui:
    name: gui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # gui/ is its own Cargo workspace with its own Cargo.lock and
        # rust-toolchain.toml, so every command here runs inside it.
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: gui
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxcb1-dev
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      # The headless platform needs no display and no GPU, so this
      # exercises the real event loop, window, list, composer, markdown
      # and the 30 Hz stream on every Linux CI run.
      - name: Smoke run
        if: runner.os == 'Linux'
        run: ZED_HEADLESS=1 timeout 60 ./target/debug/kage-desktop --smoke 5000 --stream
