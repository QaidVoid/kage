name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  lua-types:
    name: lua-types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Regenerate the lua-language-server stub and fail if the
      # committed plugins/types/kage.lua drifts from the in-tree spec
      # (same shape as the cargo fmt --check gate).
      - run: cargo xtask gen-lua-types --check
      # Enforce the ASCII-only source rule (CLAUDE.md). Unicode glyphs
      # must be written as `\u{..}` escapes, not raw bytes.
      - run: cargo xtask check-ascii

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets -- -D warnings

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workspace pins its toolchain via rust-toolchain.toml; the
      # MSRV gate checks the declared floor against the committed
      # Cargo.lock, so install 1.89 and never touch the pinned one.
      - run: rustup toolchain install 1.89.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-1.89
      - run: cargo +1.89.0 check --workspace --all-targets --locked

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # --no-fail-fast so one failing OS surfaces every failure in that
      # leg instead of hiding them behind the first.
      - run: cargo nextest run --all-targets --no-tests=pass --no-fail-fast

  gui:
    name: gui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # gui/ is its own Cargo workspace with its own Cargo.lock and
        # rust-toolchain.toml, so every command here runs inside it.
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: gui
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxcb1-dev
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      # The headless platform needs no display and no GPU, so this
      # exercises the real event loop, window, list, composer, markdown
      # and the 30 Hz stream on every Linux CI run.
      - name: Smoke run
        if: runner.os == 'Linux'
        run: ZED_HEADLESS=1 timeout 60 ./target/debug/kage-desktop --smoke 5000 --stream
