name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  generated:
    name: generated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Regenerate the tracked generated files and fail when the
      # committed copies drift (same shape as the cargo fmt --check
      # gate).
      - run: cargo xtask gen-lua-types --check
      # Re-render crates/kage-provider/src/catalog/generated.rs from
      # the committed catalog, so hand edits to the snapshot and
      # unregenerated generator changes fail here. The catalog is
      # written by refresh-models whenever generated.rs is, keeping the
      # gate offline and deterministic. The catalog itself is built by
      # QaidVoid/kage-models; see that repo for its own drift gate.
      - run: >-
          cargo xtask refresh-models --check
          --source file://xtask/fixtures/catalog.json
      # Re-render man/kage.1 from the clap CLI definition and diff it
      # against the committed page, so flag changes force a refresh
      # before release.yml ships a stale page in every archive. The
      # page embeds the crate version, so a version bump must
      # regenerate it in the same change.
      - name: gen-manpage drift
        run: |
          cargo build -p kage-cli
          ./target/debug/kage gen-manpage --out man/kage.1 --check
      # Enforce the ASCII-only source rule. Scans crates/, xtask/src,
      # plugins/ and man/; Unicode glyphs must be written as
      # `\u{..}` escapes, not raw bytes.
      - run: cargo xtask check-ascii

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets -- -D warnings

  msrv:
    name: msrv (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace
            toolchain: "1.89.0"
            check: cargo +1.89.0 check --workspace --exclude kage-desktop --all-targets --locked
          # kage-desktop's floor is 1.95, kept from the GPUI days
          # because that is where the client was written; the egui
          # stack itself asks for less. The leg still catches anything
          # in the lockfile that quietly starts needing newer.
          - name: desktop
            toolchain: "1.95.0"
            check: cargo +1.95.0 check -p kage-desktop --all-targets --locked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workspace pins its toolchain via rust-toolchain.toml; the
      # MSRV gates check the declared floors against the committed
      # Cargo.lock, so install the floors and never touch the pin.
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-${{ matrix.toolchain }}
      - run: ${{ matrix.check }}

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # --no-fail-fast so one failing OS surfaces every failure in that
      # leg instead of hiding them behind the first. The desktop job
      # runs kage-desktop's suite, which needs a software GL stack.
      - run: cargo nextest run --profile ci --workspace --exclude kage-desktop --all-targets --no-tests=pass --no-fail-fast

  # The shared host must stay as small as a private engine, and the
  # standalone TUI near what the engine TUI was. Memory is only
  # meaningful in a release build, so this measures one on Linux.
  memory:
    name: memory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: memory
      - run: cargo test --locked --release -p kage-cli --test shared_host -- --ignored

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxcb1-dev xvfb
      - run: cargo clippy --locked -p kage-desktop --all-targets -- -D warnings
      - run: cargo build --locked -p kage-desktop
      # The kittest snapshot probes render through the wgpu backend,
      # which on a headless Linux runner needs a software GL stack
      # (mesa's lavapipe) to rasterize the shell and compare it to the
      # committed baselines. Without it a snapshot comparison fails to
      # render rather than to compare.
      - name: Install the software GL stack
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri libegl-mesa0
          # The CJK probe lays its line out with a system CJK face.
          sudo apt-get install -y fonts-noto-cjk
          # lavapipe must be the only device the runner sees, so the
          # probes do not depend on whatever driver the image ships.
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
      # Every probe target, including the parity rig's snapshot
      # comparison. The lib unit tests run here too, so this leg is the
      # desktop suite on all three platforms.
      - name: Probe run
        run: cargo test --locked -p kage-desktop --all-targets --no-fail-fast
      # The smoke run drives the real event loop, window, list,
      # composer, markdown and the 30 Hz stream on every Linux CI run.
      # winit needs a display, so it opens under Xvfb; --replay feeds
      # it the recorded transcript, since a runner has no engine to
      # attach to.
      - name: Smoke run
        if: runner.os == 'Linux'
        run: xvfb-run -a ./target/debug/kage-desktop --replay --smoke 5000 --stream
      # The web target compiles on the pinned stable toolchain, and the
      # wasm-bindgen CLI turns the cdylib into the bundle
      # crates/kage-desktop/web/ ships. No nightly anywhere: the old GPUI web build needed
      # `stdarch_wasm_atomic_wait` from nightly, which the egui stack
      # does not use. The CLI version must equal the pinned crate.
      - name: wasm build
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          cargo build --locked --release --target wasm32-unknown-unknown \
            -p kage-desktop --no-default-features
          wasm-bindgen --version
          wasm-bindgen --out-dir crates/kage-desktop/web --target web \
            target/wasm32-unknown-unknown/release/kage_desktop.wasm
      # NFR-12 hygiene: no git-rev dependencies and no [patch.crates-io]
      # escape hatch in any Cargo.toml. A patch would fork a
      # dependency away from the lockfile the release pipeline ships.
      - name: Dependency hygiene
        shell: bash
        run: |
          if grep -rn --include=Cargo.toml 'git = ' . ; then
            echo "git dependencies are not allowed"; exit 1
          fi
          if grep -rn --include=Cargo.toml '\[patch.crates-io\]' . ; then
            echo "[patch.crates-io] is not allowed"; exit 1
          fi
