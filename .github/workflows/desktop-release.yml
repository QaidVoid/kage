name: desktop release

# Releases the desktop and web client, which version apart from the
# CLI: a push to main that raises `version` in gui/Cargo.toml tags
# `kage-desktop-v<version>`, creates its release (not marked latest, so
# `releases/latest` stays the CLI's) and builds the web bundle, the
# desktop archives and the onelf bundles into it. A manual run with no
# tag releases the current version if it has no tag yet, which is how
# the first release is cut; with a tag it rebuilds that release.
on:
  push:
    branches: [main]
    paths: [gui/Cargo.toml]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing desktop release to rebuild, such as kage-desktop-v0.1.0. Empty releases the current version.
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag to build, or nothing when the version already has one. A
  # release after the first lists the commits that touched gui/ since
  # the one before.
  release:
    name: release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Created with release-plz's token, so the desktop release names
      # the same author as the CLI's. release.yml wakes on it too and
      # skips, as it builds `v` tags only.
      - id: tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
          REBUILD: ${{ inputs.tag }}
        run: |
          if [ -n "$REBUILD" ]; then
            echo "$REBUILD" | grep -Eq '^kage-desktop-v[0-9]+\.[0-9]+\.[0-9]+$' || {
              echo "::error::tag '$REBUILD' is not kage-desktop-v<major>.<minor>.<patch>" >&2
              exit 1
            }
            echo "tag=$REBUILD" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(awk '/^\[package\]/ { p = 1; next } /^\[/ { p = 0 }
            p && /^version *=/ { gsub(/"/, "", $3); print $3; exit }' gui/Cargo.toml)"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::gui/Cargo.toml has no semver [package] version (parsed '$version')" >&2
            exit 1
          }
          tag="kage-desktop-v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag exists; nothing to release"
            exit 0
          fi
          previous="$(git tag --list 'kage-desktop-v*' --sort=-v:refname | head -n 1)"
          if [ -n "$previous" ]; then
            {
              echo "## What changed"
              echo
              git log --no-merges --format='- %s (%h)' "$previous..HEAD" -- gui/
            } > notes.md
          else
            echo "The first release of the desktop and web client." > notes.md
          fi
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "kage-desktop v$version" --notes-file notes.md --latest=false
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The browser client `kage serve` hands out: the gui/ workspace built for
  # wasm, its wasm-bindgen glue, the page and the icon set.
  web:
    name: web client
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain
        run: rustup toolchain install nightly --profile minimal --target wasm32-unknown-unknown

      # The CLI has to match the wasm-bindgen crate gui/Cargo.lock pins.
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: wasm-bindgen@0.2.129

      - name: Build
        run: |
          cargo +nightly build --release --locked --target wasm32-unknown-unknown
          wasm-bindgen --out-dir web --target web \
            target/wasm32-unknown-unknown/release/kage_desktop.wasm

      - name: Package
        run: |
          bundle=../web-bundle/web
          mkdir -p "$bundle/assets/icons"
          cp web/index.html web/favicon.svg web/boot.js web/kage_desktop.js \
            web/kage_desktop_bg.wasm "$bundle/"
          manifest="$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "gpui-kit-assets") | .manifest_path')"
          cp "$(dirname "$manifest")"/assets/icons/*.svg "$bundle/assets/icons/"
          tar -C ../web-bundle -cJf ../kage-web.tar.xz web

      - name: Verify bundle
        run: |
          listing="$(tar -tJf ../kage-web.tar.xz)"
          echo "$listing"
          echo "$listing" | grep -qx 'web/favicon.svg' || {
            echo 'the web bundle is missing web/favicon.svg' >&2
            exit 1
          }

      # Same "<hex>  <name>" sidecar format as the CLI release, so the
      # GUI-side downloader verifies every download uniformly.
      - name: Checksums
        run: sha256sum ../kage-web.tar.xz > ../kage-web.tar.xz.sha256

      - uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: kage-web.tar.xz*
          file_glob: true
          overwrite: true
          tag: ${{ env.TAG }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: kage-web.tar.xz

  # The desktop client lives in its own Cargo workspace under gui/.
  # Linux links the system display libraries, so the plain archive builds
  # on the oldest supported Ubuntu for a low glibc floor. The portable
  # onelf bundle is the desktop-onelf job's.
  desktop:
    name: desktop ${{ matrix.name }}
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: aarch64-linux
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - { name: aarch64-macos, os: macos-latest, target: aarch64-apple-darwin }
          - { name: x86_64-macos, os: macos-latest, target: x86_64-apple-darwin }
          - { name: x86_64-windows, os: windows-latest, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
        working-directory: gui
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxcb1-dev

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package
        run: |
          artifact="kage-desktop-${{ matrix.name }}"
          bin="target/${{ matrix.target }}/release/kage-desktop"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          mkdir -p "$artifact" ../dist
          cp ../LICENSE ../README.md "$artifact/"
          if [ "$RUNNER_OS" = "macOS" ]; then
            version="${TAG#kage-desktop-v}"
            app="$artifact/Kage.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp "$bin" "$app/Contents/MacOS/kage-desktop"
            cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>kage-desktop</string>
              <key>CFBundleIdentifier</key>
              <string>com.qaidvoid.kage-desktop</string>
              <key>CFBundleName</key>
              <string>Kage</string>
              <key>CFBundleIconFile</key>
              <string>kage</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$version</string>
              <key>CFBundleVersion</key>
              <string>$version</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
            # The icns comes from the brand raster; the 608 px source
            # covers every standard slot except the 1024 px @2x leg.
            iconset="$RUNNER_TEMP/kage.iconset"
            mkdir -p "$iconset"
            for slot in 16 32 128 256 512; do
              sips -z "$slot" "$slot" assets/brand/kage-glyph-shadow.png \
                --out "$iconset/icon_${slot}x${slot}.png" >/dev/null
              px=$((slot * 2))
              if [ "$px" -le 608 ]; then
                sips -z "$px" "$px" assets/brand/kage-glyph-shadow.png \
                  --out "$iconset/icon_${slot}x${slot}@2x.png" >/dev/null
              fi
            done
            iconutil -c icns "$iconset" -o "$app/Contents/Resources/kage.icns"
          else
            cp "$bin" "$artifact/"
            if [ "$RUNNER_OS" = "Linux" ]; then
              mkdir -p "$artifact/share/applications" "$artifact/share/icons"
              printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=kage' \
                'Comment=Desktop client for the kage coding agent' \
                'Exec=kage-desktop' 'Icon=kage' 'Terminal=false' \
                'Categories=Development;' > "$artifact/share/applications/kage.desktop"
              cp -R assets/icons/hicolor "$artifact/share/icons/hicolor"
            fi
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../dist/$artifact.zip" "$artifact"
          else
            tar -cJf "../dist/$artifact.tar.xz" "$artifact"
          fi

      # Lists the archive and fails when the integration files are
      # missing: the freedesktop sidecars on Linux, the app bundle on
      # macOS. The Windows zip carries the embedded icon resource
      # instead, so it has no leg here.
      - name: Verify archives
        if: runner.os != 'Windows'
        run: |
          folder="kage-desktop-${{ matrix.name }}"
          artifact="$folder.tar.xz"
          listing="$(tar -tJf "../dist/$artifact")"
          echo "$listing"
          check() {
            echo "$listing" | grep -qx "$folder/$1" || {
              echo "$artifact is missing $1" >&2
              exit 1
            }
          }
          if [ "$RUNNER_OS" = "Linux" ]; then
            check share/applications/kage.desktop
            for size in 16x16 32x32 48x48 64x64 128x128 256x256 512x512; do
              check "share/icons/hicolor/$size/apps/kage.png"
            done
          else
            check Kage.app/Contents/MacOS/kage-desktop
            check Kage.app/Contents/Info.plist
            check Kage.app/Contents/Resources/kage.icns
            tar -xJf "../dist/$artifact" -C "$RUNNER_TEMP" \
              "$folder/Kage.app/Contents/Info.plist"
            plutil -lint "$RUNNER_TEMP/$folder/Kage.app/Contents/Info.plist"
          fi

      - name: Subjects
        id: subjects
        working-directory: dist
        run: echo "subjects=$(printf 'dist/%s\n' * | paste -sd, -)" >> "$GITHUB_OUTPUT"

      # Runs after Subjects so attestation keeps naming the archives only;
      # the upload glob below ships the sidecars alongside them.
      - name: Checksums
        working-directory: dist
        run: |
          for file in *; do
            [ -f "$file" ] || continue
            sha256sum "$file" > "$file.sha256"
          done

      - uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          overwrite: true
          tag: ${{ env.TAG }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.subjects }}

  # The portable Linux bundle, built in Arch the way aeris builds its own:
  # a glibc and loader bundled from Ubuntu did not run on other systems.
  # It carries the Vulkan stack too, slimmed, so it starts on a host
  # without one; onelf's launch resolver weighs each bundled library
  # against the host's copy. No lavapipe: no slimmed build of it matches
  # the slimmed LLVM yet.
  desktop-onelf:
    name: desktop onelf ${{ matrix.name }}
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            arch: x86_64
            runner: ubuntu-latest
            image: archlinux:latest
            onelf-sha256: 3a990243790c026c902330a7744e8c21b25fdc8c694a88e79d6fb25d761a6351
            vulkan: vulkan-radeon vulkan-intel vulkan-nouveau
            # Slimmed packages, one "name archive sha256" row per
            # package. Upstream rebuilds the continuous release between
            # our runs, so a stale row fails the hash check: re-read the
            # digests from the release page and update the row.
            # https://github.com/pkgforge-dev/archlinux-pkgs-debloated/releases/tag/continuous
            slim: |
              llvm-libs-nano pkg.tar.zst f186b7d2f8367e3b53f0192a9ad60e69987188efa7a2c0770577fb3f03981170
              mesa-nano pkg.tar.zst a32ecc91a446ce73318f16befbe04742517392d07bf75d55c652bca673550082
              vulkan-radeon-nano pkg.tar.zst e2559a93f90835305cdc91f953681fd0d35aefab135acad0e191069621e66669
              vulkan-intel-nano pkg.tar.zst fe1fb79cb47bad431e10c40cd34c83fac437d012525268c00c77de56b032e2f3
              vulkan-nouveau-nano pkg.tar.zst 20d27dfd967be73fa23e0107fb0977c3a560b81e8a3506e79df9be47a8352dec
              libxml2-iculess pkg.tar.zst d5220136f8d9b4eaaf173a44d3f0092e97b61cfe9f5d627c570c6e81add9e789
          - name: aarch64-linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm:latest
            onelf-sha256: 9b5b2c3d031756a064bd9a71a977e229cb359f324937a5ba8a28db1568bae15b
            vulkan: vulkan-radeon vulkan-nouveau vulkan-panfrost vulkan-broadcom
            slim: |
              llvm-libs-nano pkg.tar.zst 4f2bd7d178432e42f2ba2a756fd0fd864795edf2fac73b5c51761103880e0b40
              mesa-nano pkg.tar.zst 1fedba1c08c845f4a034ea73cd95ef96d8bf2be91fbb247672552c48d72d12a3
              vulkan-radeon-nano pkg.tar.zst 17a0a0be41c5036346a57ca819174962f95b7b318d993559f76eca3e66104fad
              vulkan-nouveau-nano pkg.tar.zst b9fac6605dbf0900deb70c61c34407efee059d12a230e8b928a8bcf59507eeaa
              vulkan-panfrost-nano pkg.tar.zst cb52c18eb7365f984ac81932171dcbe9907181752f492da233f84710eaf541f2
              vulkan-broadcom-nano pkg.tar.zst fe01d709afab23a3614efc53b35f2a42518ad24948a149880365a25010e02d64
              libxml2-iculess pkg.tar.xz 3e9eed60d2a40ad1ca623a0ba4607c22ac4030e18416080538c04fd82ce3add4
    defaults:
      run:
        shell: bash
        working-directory: gui
    env:
      ONELF_VERSION: 0.3.3
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Install Arch packages
        working-directory: /
        run: |
          pacman -Syu --disable-sandbox --noconfirm --needed \
            base-devel git curl tar xz rustup patchelf pkgconf \
            libxcb libxkbcommon libxkbcommon-x11 wayland fontconfig \
            mesa vulkan-icd-loader ${{ matrix.vulkan }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain
        run: rustup toolchain install

      - name: Build
        run: cargo build --release --locked

      # The graphics stack is most of the bundle and LLVM over half of it.
      # These builds drop what a bundled renderer never reaches for and
      # install under the stock names, so onelf picks them up unchanged.
      # After the build: rustc links the system LLVM, and the slim one
      # lacks targets it needs.
      - name: Slim the graphics stack
        working-directory: /tmp
        run: |
          base="https://github.com/pkgforge-dev/archlinux-pkgs-debloated/releases/download/continuous"
          mkdir -p debloated
          cd debloated
          # The matrix pins the archive format and its sha256 per
          # package: these libraries are linked into the attested bundle,
          # so the downloads must match the rows. Upstream rebuilds the
          # continuous release between runs; a changed asset fails the
          # check and the digests get re-read from the release page.
          while read -r pkg ext sha; do
            [ -n "$pkg" ] || continue
            file="$pkg-${{ matrix.arch }}.$ext"
            curl -fsSL -O "$base/$file" || {
              echo "no $file published" >&2
              exit 1
            }
            echo "$sha  $file" | sha256sum -c -
          done <<'ROWS'
          ${{ matrix.slim }}
          ROWS
          pacman -U --disable-sandbox --noconfirm ./*.pkg.tar.*

      - name: Install onelf
        run: |
          curl -fsSL -o /usr/local/bin/onelf \
            "https://github.com/QaidVoid/onelf/releases/download/$ONELF_VERSION/onelf-${{ matrix.name }}"
          echo "${{ matrix.onelf-sha256 }}  /usr/local/bin/onelf" | sha256sum -c -
          chmod +x /usr/local/bin/onelf

      - name: Pack with onelf
        run: |
          mkdir -p AppDir/bin AppDir/.onelf/icons AppDir/.onelf/desktop \
            AppDir/share/icons ../dist
          cp target/release/kage-desktop AppDir/bin/kage-desktop
          # Shadow stays the default icon and dawn rides under the
          # entrypoint name; the hicolor ladder serves theme lookups.
          cp assets/brand/kage-glyph-shadow.png AppDir/.onelf/icons/default.png
          cp assets/brand/kage-glyph-dawn.png AppDir/.onelf/icons/kage-desktop.png
          cp -R assets/icons/hicolor AppDir/share/icons/hicolor
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=kage' \
            'Comment=Desktop client for the kage coding agent' \
            'Exec=kage-desktop' 'Icon=default' 'Terminal=false' \
            'Categories=Development;' > AppDir/.onelf/desktop/default.desktop
          for wanted in \
            AppDir/.onelf/icons/default.png \
            AppDir/.onelf/icons/kage-desktop.png \
            AppDir/.onelf/desktop/default.desktop \
            AppDir/share/icons/hicolor/512x512/apps/kage.png; do
            [ -f "$wanted" ] || {
              echo "the onelf AppDir is missing $wanted" >&2
              exit 1
            }
          done
          cp onelf.toml AppDir/onelf.toml
          version="${TAG#kage-desktop-v}"
          sed -i "s/^version[[:space:]]*=.*/version = \"$version\"/" AppDir/onelf.toml
          grep -qx "version = \"$version\"" AppDir/onelf.toml || {
            echo "AppDir/onelf.toml does not name version $version" >&2
            exit 1
          }
          onelf build AppDir
          onelf verify AppDir/kage-desktop.onelf
          mv AppDir/kage-desktop.onelf "../dist/kage-desktop-${{ matrix.name }}.onelf"

      # The headless platform needs no display, so this proves the bundle
      # unpacks and starts its event loop. The container has no fonts, and
      # GPUI needs a system font to start.
      - name: Smoke run the bundle
        run: |
          pacman -S --disable-sandbox --noconfirm --needed ttf-dejavu
          ZED_HEADLESS=1 timeout 60 "../dist/kage-desktop-${{ matrix.name }}.onelf" --smoke 3000

      - name: Checksums
        working-directory: dist
        run: sha256sum "kage-desktop-${{ matrix.name }}.onelf" > "kage-desktop-${{ matrix.name }}.onelf.sha256"

      - uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/kage-desktop-${{ matrix.name }}.onelf*
          file_glob: true
          overwrite: true
          tag: ${{ env.TAG }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kage-desktop-${{ matrix.name }}.onelf
