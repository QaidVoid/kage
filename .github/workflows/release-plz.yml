name: release-plz

on:
  push:
    branches: [main]

jobs:
  # Publishes the crates and tags the release once a release PR is
  # merged. crates.io trusted publishing hands out the token through
  # the OIDC id-token, so no registry secret is set.
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A release created with GITHUB_TOKEN does not start `on: release`
      # workflows, so publishing without the personal token ships a
      # binary-less release. Fail before anything is published.
      - name: Check the release token
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo '::error::RELEASE_PLZ_TOKEN is unset; the release would publish with no binaries'
            exit 1
          fi
      - run: rustup toolchain install
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release
        env:
          # A personal token, so the GitHub release it creates starts
          # the binary release workflow.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  # Opens or updates the release PR with the next version and the
  # changelog of the commits since the last release.
  release-pr:
    name: release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - run: rustup toolchain install
      - uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  # release-plz bumps the workspace crates but cannot run our
  # generators, so a fresh release PR always fails its checks twice:
  # the man page embeds the crate version, and gui/Cargo.lock pins the
  # crates it builds against. Regenerate both on the PR branch, so the
  # release PR lands green without a manual round trip.
  fixup:
    name: fix up the release PR
    needs: release-pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Find the release PR branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          branch="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --limit 100 --json headRefName --jq '.[].headRefName' \
            | grep '^release-plz-' | head -n 1)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.branch != ''
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Toolchain
        if: steps.pr.outputs.branch != ''
        run: rustup toolchain install

      - name: Regenerate the man page
        if: steps.pr.outputs.branch != ''
        run: |
          cargo build --locked -p kage-cli --bin kage
          ./target/debug/kage gen-manpage --out man/kage.1

      - name: Refresh the gui lockfile
        if: steps.pr.outputs.branch != ''
        # `cargo metadata` re-resolves without compiling, which is all
        # the lockfile refresh needs: the bumped path deps get their
        # new versions, nothing else moves.
        run: |
          cd gui
          cargo metadata --format-version 1 > /dev/null

      - name: Commit and push the refreshes
        if: steps.pr.outputs.branch != ''
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          git config user.name "kage fixup"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- man/kage.1 gui/Cargo.lock; then
            echo "the release PR is already current; nothing to push"
            exit 0
          fi
          git add man/kage.1 gui/Cargo.lock
          git commit -m "chore: regenerate the man page and gui lock for v$version"
          git push origin "HEAD:$BRANCH"
