name: release

# Builds the `kage` binary and the `kage-desktop` client for each
# target when release-plz publishes a GitHub release, and attaches the
# archives to it. A manual run rebuilds the release of the given tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build, such as v0.1.0
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  attestations: write
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The browser client `kage serve` hands out: the gui/ workspace built for
  # wasm, its wasm-bindgen glue, the page and the icon set. It ships on its
  # own and inside the `-web` CLI archives.
  web:
    name: web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain
        run: rustup toolchain install nightly --profile minimal --target wasm32-unknown-unknown

      # The CLI has to match the wasm-bindgen crate gui/Cargo.lock pins.
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: wasm-bindgen@0.2.129

      - name: Build
        run: |
          cargo +nightly build --release --locked --target wasm32-unknown-unknown
          wasm-bindgen --out-dir web --target web \
            target/wasm32-unknown-unknown/release/kage_desktop.wasm

      - name: Package
        run: |
          bundle=../web-bundle/web
          mkdir -p "$bundle/assets/icons"
          cp web/index.html web/boot.js web/kage_desktop.js web/kage_desktop_bg.wasm "$bundle/"
          manifest="$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "gpui-kit-assets") | .manifest_path')"
          cp "$(dirname "$manifest")"/assets/icons/*.svg "$bundle/assets/icons/"
          tar -C ../web-bundle -cJf ../kage-web.tar.xz web
          cd ..
          sha256sum kage-web.tar.xz > kage-web.tar.xz.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-bundle
          path: web-bundle/web

      - uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: kage-web.tar.xz*
          file_glob: true
          overwrite: true
          tag: ${{ env.TAG }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: kage-web.tar.xz

  binaries:
    name: ${{ matrix.name }}
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64-linux, os: ubuntu-latest, target: x86_64-unknown-linux-musl, cross: true, ext: tar.gz }
          - { name: aarch64-linux, os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true, ext: tar.gz }
          - { name: aarch64-macos, os: macos-latest, target: aarch64-apple-darwin, cross: false, ext: tar.gz }
          - { name: x86_64-windows, os: windows-latest, target: x86_64-pc-windows-msvc, cross: false, ext: zip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross

      - name: Build
        shell: bash
        env:
          # Static musl binaries that run on any Linux.
          RUSTFLAGS: ${{ matrix.cross && '-C target-feature=+crt-static' || '' }}
        run: |
          tool=cargo
          if [ "${{ matrix.cross }}" = "true" ]; then tool=cross; fi
          "$tool" build --release --locked -p kage-cli --target "${{ matrix.target }}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-bundle
          path: web-bundle

      # Two archives: the CLI alone, and the CLI with the web client in a
      # `web/` directory beside it, where `kage serve` finds it unasked.
      - name: Package
        shell: bash
        run: |
          artifact="kage-${{ matrix.name }}"
          bin="target/${{ matrix.target }}/release/kage"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          mkdir -p "$artifact" "$artifact-web" dist
          cp "$bin" LICENSE README.md man/kage.1 "$artifact/"
          cp -R "$artifact"/. "$artifact-web/"
          cp -R web-bundle "$artifact-web/web"
          for name in "$artifact" "$artifact-web"; do
            file="dist/$name.${{ matrix.ext }}"
            if [ "$RUNNER_OS" = "Windows" ]; then
              7z a "$file" "$name"
            else
              tar -czf "$file" "$name"
            fi
          done
          cd dist
          for file in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$file" > "$file.sha256"
            else
              shasum -a 256 "$file" > "$file.sha256"
            fi
          done

      - uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          overwrite: true
          tag: ${{ env.TAG }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kage-${{ matrix.name }}.${{ matrix.ext }}
            dist/kage-${{ matrix.name }}-web.${{ matrix.ext }}

  # The desktop client lives in its own Cargo workspace under gui/.
  # Linux links the system display libraries, so the plain archive builds
  # on the oldest supported Ubuntu for a low glibc floor. The portable
  # onelf bundle is the desktop-onelf job's.
  desktop:
    name: desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: aarch64-linux
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - { name: aarch64-macos, os: macos-latest, target: aarch64-apple-darwin }
          - { name: x86_64-macos, os: macos-latest, target: x86_64-apple-darwin }
          - { name: x86_64-windows, os: windows-latest, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxcb1-dev

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package
        run: |
          artifact="kage-desktop-${{ matrix.name }}"
          bin="target/${{ matrix.target }}/release/kage-desktop"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          mkdir -p "$artifact" ../dist
          cp "$bin" ../LICENSE ../README.md "$artifact/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../dist/$artifact.zip" "$artifact"
          else
            tar -cJf "../dist/$artifact.tar.xz" "$artifact"
          fi

      - name: Checksums
        id: checksums
        working-directory: dist
        run: |
          echo "subjects=$(printf 'dist/%s\n' * | paste -sd, -)" >> "$GITHUB_OUTPUT"
          for file in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$file" > "$file.sha256"
            else
              shasum -a 256 "$file" > "$file.sha256"
            fi
          done

      - uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          overwrite: true
          tag: ${{ env.TAG }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.checksums.outputs.subjects }}

  # The portable Linux bundle, built in Arch the way aeris builds its own:
  # a glibc and loader bundled from Ubuntu did not run on other systems.
  # It carries the Vulkan stack too, slimmed, so it starts on a host
  # without one; onelf's launch resolver weighs each bundled library
  # against the host's copy. No lavapipe: no slimmed build of it matches
  # the slimmed LLVM yet.
  desktop-onelf:
    name: desktop onelf ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            arch: x86_64
            runner: ubuntu-latest
            image: archlinux:latest
            pkg-ext: pkg.tar.zst
            onelf-sha256: 3a990243790c026c902330a7744e8c21b25fdc8c694a88e79d6fb25d761a6351
            vulkan: vulkan-radeon vulkan-intel vulkan-nouveau
            slim: llvm-libs-nano mesa-nano vulkan-radeon-nano vulkan-intel-nano vulkan-nouveau-nano libxml2-iculess
          - name: aarch64-linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm:latest
            pkg-ext: pkg.tar.xz
            onelf-sha256: 9b5b2c3d031756a064bd9a71a977e229cb359f324937a5ba8a28db1568bae15b
            vulkan: vulkan-radeon vulkan-nouveau vulkan-panfrost vulkan-broadcom
            slim: llvm-libs-nano mesa-nano vulkan-radeon-nano vulkan-nouveau-nano vulkan-panfrost-nano vulkan-broadcom-nano libxml2-iculess
    defaults:
      run:
        shell: bash
        working-directory: gui
    env:
      ONELF_VERSION: 0.3.3
    steps:
      - name: Install Arch packages
        working-directory: /
        run: |
          pacman -Syu --disable-sandbox --noconfirm --needed \
            base-devel git curl tar xz rustup patchelf pkgconf \
            libxcb libxkbcommon libxkbcommon-x11 wayland fontconfig \
            mesa vulkan-icd-loader ${{ matrix.vulkan }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain
        run: rustup toolchain install

      - name: Build
        run: cargo build --release --locked

      # The graphics stack is most of the bundle and LLVM over half of it.
      # These builds drop what a bundled renderer never reaches for and
      # install under the stock names, so onelf picks them up unchanged.
      # After the build: rustc links the system LLVM, and the slim one
      # lacks targets it needs.
      - name: Slim the graphics stack
        working-directory: /tmp
        run: |
          base="https://github.com/pkgforge-dev/archlinux-pkgs-debloated/releases/download/continuous"
          mkdir -p debloated
          cd debloated
          for pkg in ${{ matrix.slim }}; do
            curl -fsSL -O "$base/$pkg-${{ matrix.arch }}.${{ matrix.pkg-ext }}"
          done
          pacman -U --disable-sandbox --noconfirm ./*.${{ matrix.pkg-ext }}

      - name: Install onelf
        run: |
          curl -fsSL -o /usr/local/bin/onelf \
            "https://github.com/QaidVoid/onelf/releases/download/$ONELF_VERSION/onelf-${{ matrix.name }}"
          echo "${{ matrix.onelf-sha256 }}  /usr/local/bin/onelf" | sha256sum -c -
          chmod +x /usr/local/bin/onelf

      - name: Pack with onelf
        run: |
          mkdir -p AppDir/bin AppDir/.onelf/icons AppDir/.onelf/desktop ../dist
          cp target/release/kage-desktop AppDir/bin/kage-desktop
          cp assets/brand/kage-glyph-shadow.png AppDir/.onelf/icons/default.png
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=kage' \
            'Comment=Desktop client for the kage coding agent' \
            'Exec=kage-desktop' 'Icon=default' 'Terminal=false' \
            'Categories=Development;' > AppDir/.onelf/desktop/default.desktop
          cp onelf.toml AppDir/onelf.toml
          sed -i "s/^version = .*/version = \"${TAG#v}\"/" AppDir/onelf.toml
          onelf build AppDir
          onelf verify AppDir/kage-desktop.onelf
          mv AppDir/kage-desktop.onelf "../dist/kage-desktop-${{ matrix.name }}.onelf"

      # The headless platform needs no display, so this proves the bundle
      # unpacks and starts its event loop. The container has no fonts, and
      # GPUI needs a system font to start.
      - name: Smoke run the bundle
        run: |
          pacman -S --disable-sandbox --noconfirm --needed ttf-dejavu
          ZED_HEADLESS=1 timeout 60 "../dist/kage-desktop-${{ matrix.name }}.onelf" --smoke 3000

      - name: Checksum
        working-directory: dist
        run: sha256sum "kage-desktop-${{ matrix.name }}.onelf" > "kage-desktop-${{ matrix.name }}.onelf.sha256"

      - uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/kage-desktop-${{ matrix.name }}.onelf*
          file_glob: true
          overwrite: true
          tag: ${{ env.TAG }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kage-desktop-${{ matrix.name }}.onelf
