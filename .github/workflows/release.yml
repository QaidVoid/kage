name: release

# Builds the `kage` binary for each target when release-plz publishes
# a `v<version>` release, and attaches the archives to it. A manual run
# rebuilds the release of the given tag. The desktop and web client
# release on their own; see desktop-release.yml.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to build, such as v0.1.0
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  attestations: write
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  binaries:
    name: ${{ matrix.name }}
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64-linux, os: ubuntu-latest, target: x86_64-unknown-linux-musl, cross: true, ext: tar.xz }
          - { name: aarch64-linux, os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true, ext: tar.xz }
          - { name: aarch64-macos, os: macos-latest, target: aarch64-apple-darwin, cross: false, ext: tar.xz }
          - { name: x86_64-macos, os: macos-latest, target: x86_64-apple-darwin, cross: false, ext: tar.xz }
          - { name: x86_64-windows, os: windows-latest, target: x86_64-pc-windows-msvc, cross: false, ext: zip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"

      - name: Install cross
        if: matrix.cross
        # Pinned to a tagged release so the musl binaries stay
        # reproducible across runs; bump the version deliberately
        # instead of floating on the cross git HEAD.
        run: cargo install cross --locked --version 0.2.5

      - name: Build
        shell: bash
        env:
          # Static musl binaries that run on any Linux.
          RUSTFLAGS: ${{ matrix.cross && '-C target-feature=+crt-static' || '' }}
        run: |
          tool=cargo
          if [ "${{ matrix.cross }}" = "true" ]; then tool=cross; fi
          "$tool" build --release --locked -p kage-cli --target "${{ matrix.target }}"

      - name: Package
        shell: bash
        run: |
          artifact="kage-${{ matrix.name }}"
          bin="target/${{ matrix.target }}/release/kage"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          mkdir -p "$artifact" dist
          cp "$bin" LICENSE README.md "$artifact/"
          # The man page rides in its own directory: the layout the
          # verify step and manual installs script against.
          mkdir -p "$artifact/man"
          cp man/kage.1 "$artifact/man/"
          # Raw binary next to the archive for the GUI-side downloader,
          # named after the target triple; cp keeps the executable bit
          # and Windows keeps the .exe suffix.
          raw="dist/kage-${{ matrix.target }}"
          if [ "$RUNNER_OS" = "Windows" ]; then raw="$raw.exe"; fi
          cp "$bin" "$raw"
          file="dist/$artifact.${{ matrix.ext }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$file" "$artifact"
          else
            tar -cJf "$file" "$artifact"
          fi

      # Fails when a file did not make it into the archive; the binary,
      # license, readme and man page are what downloaders script against.
      - name: Verify archives
        shell: bash
        run: |
          artifact="kage-${{ matrix.name }}"
          file="dist/$artifact.${{ matrix.ext }}"
          bin="kage"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="kage.exe"; fi
          if [ "${{ matrix.ext }}" = "zip" ]; then
            listing="$(7z l -slt "$file" | sed -n 's/^Path = //p' | tr '\\' '/')"
          else
            listing="$(tar -tJf "$file")"
          fi
          echo "$listing"
          for wanted in \
            "$artifact/$bin" \
            "$artifact/LICENSE" \
            "$artifact/README.md" \
            "$artifact/man/kage.1"; do
            echo "$listing" | grep -qx "$wanted" || {
              echo "$file is missing $wanted" >&2
              exit 1
            }
          done

      # One standard "<hex>  <name>" line per dist asset: the first token
      # parses as the digest and `sha256sum -c` accepts the file, which is
      # how the GUI-side downloader verifies archives and raw binaries.
      # The upload glob below picks the sidecars up like any dist file.
      - name: Checksums
        shell: bash
        working-directory: dist
        run: |
          for file in *; do
            [ -f "$file" ] || continue
            sha256sum "$file" > "$file.sha256"
          done

      - uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          overwrite: true
          tag: ${{ env.TAG }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kage-${{ matrix.name }}.${{ matrix.ext }}
            dist/kage-${{ matrix.target }}${{ matrix.ext == 'zip' && '.exe' || '' }}
