[workspace]
resolver = "3"
members = [
    "crates/kage-acp",
    "crates/kage-cli",
    "crates/kage-core",
    "crates/kage-loop",
    "crates/kage-mcp",
    "crates/kage-plugin",
    "crates/kage-provider",
    "crates/kage-sandbox",
    "crates/kage-session",
    "crates/kage-tools",
    "crates/kage-tui",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.86"
repository = "https://github.com/QaidVoid/kage"
homepage = "https://github.com/QaidVoid/kage"
readme = "README.md"
keywords = ["agent", "llm", "ai", "tui", "lua"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
kage-core = { path = "crates/kage-core" }
kage-loop = { path = "crates/kage-loop" }
kage-plugin = { path = "crates/kage-plugin" }
kage-provider = { path = "crates/kage-provider" }
kage-session = { path = "crates/kage-session" }
kage-tools = { path = "crates/kage-tools" }
kage-tui = { path = "crates/kage-tui" }

base64 = "0.22.1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.1"
clap_mangen = "0.3.0"

chrono = { version = "0.4.44", features = ["serde"] }
dirs = "6.0.0"
figment = { version = "0.10.19", features = ["toml", "env"] }
globset = "0.4.18"
grep = "0.4.1"
html2text = "0.17.1"
ignore = "0.4.25"
mlua = { version = "0.11.6", features = ["lua54", "vendored", "send"] }
notify = "8.2.0"
pulldown-cmark = { version = "0.13.3", default-features = false, features = ["simd"] }
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
rpassword = "7.5.2"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
similar = "3.1.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
tiktoken-rs = "0.11.0"
toml = "1.1.2"
ulid = { version = "1.2.1", features = ["serde"] }
ureq = { version = "3.3.0", features = ["json"] }
url = "2.5.8"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
