[workspace]
resolver = "3"
members = [
    "crates/kage-acp",
    "crates/kage-cli",
    "crates/kage-core",
    "crates/kage-loop",
    "crates/kage-mcp",
    "crates/kage-plugin",
    "crates/kage-provider",
    "crates/kage-sandbox",
    "crates/kage-session",
    "crates/kage-tools",
    "crates/kage-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
