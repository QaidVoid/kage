[workspace]
resolver = "3"
members = [
    "crates/kage-acp",
    "crates/kage-cli",
    "crates/kage-core",
    "crates/kage-loop",
    "crates/kage-mcp",
    "crates/kage-plugin",
    "crates/kage-provider",
    "crates/kage-sandbox",
    "crates/kage-session",
    "crates/kage-tools",
    "crates/kage-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
kage-acp = { path = "crates/kage-acp" }
kage-core = { path = "crates/kage-core" }
kage-loop = { path = "crates/kage-loop" }
kage-mcp = { path = "crates/kage-mcp" }
kage-plugin = { path = "crates/kage-plugin" }
kage-provider = { path = "crates/kage-provider" }
kage-sandbox = { path = "crates/kage-sandbox" }
kage-session = { path = "crates/kage-session" }
kage-tools = { path = "crates/kage-tools" }
kage-tui = { path = "crates/kage-tui" }

chrono = { version = "0.4.44", features = ["serde"] }
dirs = "6.0.0"
figment = { version = "0.10.19", features = ["toml", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
ulid = { version = "1.2.1", features = ["serde"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
