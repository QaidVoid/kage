[workspace]
resolver = "3"
members = ["."]

[package]
name = "kage-desktop"
version = "0.1.0"
edition = "2024"
description = "The kage desktop client"
license = "MIT"
publish = false

[lib]
# cdylib so the wasm bundle carries the exported web entry; rlib for the
# native binary and tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Exactly pinned GPUI Kit stack. gpui-kit 0.7.0 re-exports GPUI (`gpui-pre`
# 0.3.7), the platform crates and gpui-component 0.7.0; every one of those is
# pinned `=x.y.z` inside the toolkit itself, so this single pin holds the
# whole tree. Bump all of them together, see SPIKE.md for the procedure.
# The pin covers the web too: gpui-kit pulls `gpui-pre-web` 0.3.7 on wasm
# targets, WebGPU with a WebGL2 canvas fallback.
gpui-kit = "=0.7.0"
kage-client = { path = "../crates/kage-client" }
async-channel = "2.5"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# `std::time::Instant::now` panics in the browser; this one reads
# `performance.now` there and is std on native.
web-time = "1"
# Local wall-clock labels; already in the toolkit tree with its clock
# and wasm features.
chrono = "0.4"
# The config.toml preview the settings forms show.
toml = "1"

[dev-dependencies]
# The same pinned toolkit with headless windows and input dispatch, for
# the transcript's instrumented render tests. Test-only: the shipped
# binary never builds with it.
gpui-kit = { version = "=0.7.0", features = ["test-support"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Plain WebSocket client, no TLS: kage serves loopback ws:// only.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Exactly the versions the toolkit's web stack resolved, so the lockfile
# and the wasm-bindgen-cli version stay one and the same.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
# `Date.now`, the browser clock behind `clock::unix_seconds`.
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = [
    "BinaryType",
    "Document",
    "Location",
    "MessageEvent",
    "Storage",
    "WebSocket",
    "Window",
] }

# gpui-base 0.7.0 reads `std::time::Instant` on every touch that lands on
# an input, which panics in a browser and leaves the web client dead after
# the first tap. Upstream fixed it after the release (longbridge/gpui-kit#3271);
# this pins that commit, three past 0.7.0. Drop it once a release carries it.
[patch.crates-io]
gpui-base = { git = "https://github.com/longbridge/gpui-kit", rev = "5a3892ce7fb23f056462b9391b4e523a8a5f3623" }

# Size and speed for shipped binaries, after soar's profile. Nothing in
# the client recovers from a panic, so aborting drops the unwind tables.
[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
